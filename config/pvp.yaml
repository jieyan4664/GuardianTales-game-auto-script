# PVP 圆形角斗场 配置

# ---- 战斗结束判定 ----
# 战后画面顺序 (实测):
#   战斗进行中 → 段位升降/结算画面 → 黑屏 → 被挑战弹窗(若有) → 对手列表
#
# 判定策略, 按优先级:
#
# 策略 0 (最优): 结算按钮的【黄色背景占比】  ← 推荐
#   结算/确认按钮是"文字+黄色背景"的长方形. 纯色块不能拿去做模板匹配
#   (整块无差异, CCOEFF 归一化会退化, 可能到处都匹配), 改用颜色占比:
#   不看文字、不怕被段位弹窗遮挡一半(剩下半仍有约 50% 黄像素).
#
# 策略 A: 等【结算画面的元素出现】= 打完
#   为什么需要: 实测战斗 HUD 元素(统计按钮 dps/heal/hp)在结算画面上【依然存在】
#     (结算画面本身就会显示 dps/heal/hp 数据), 所以"等 HUD 消失"永远等不到.
#     而结算画面会停留较长时间, 等它"出现"没有时序竞争.
#
# 策略 B: 战斗 HUD【出现 → 连续消失】  ← 兜底, 慎用
#   仅在 0 和 A 都没配时使用. 要求目标元素真正"战斗专属", 否则会一直等到超时.

# ---- 策略 0: 颜色判定 ----
# roi: 结算/确认按钮【不会被遮挡的那部分黄色区域】
#      采集: python tools/cropper.py --live --roi-mode  (框选那块黄色)
# rgb: 黄色的 RGB 值; 用下面这条命令可取样
#      (把 ROI 填进去, 会打印该区域平均色)
# ratio: 达到这个占比就算检测到 (被遮挡一半时设 0.2~0.3)
battle_result_color:
  roi: null          # TODO 待采集: [x, y, w, h]
  rgb: [255, 210, 60]
  tol: 40
  ratio: 0.25

# ---- 策略 A: 结算画面元素 (可选) ----
battle_result_templates: []
  # - colosseum_result_ok

# ---- 策略 B: 战斗 HUD ----
# 战斗画面的 dps/heal/hp 图标【偏黄】, 结算画面上同款图标是【白色】的.
# TM_CCOEFF_NORMED 对亮度/对比度不敏感, 黄白两版都会高分命中,
# 所以命中后还要校验颜色: 偏黄程度 = (R+G)/2 - B 达到阈值才算真的在战斗中.
battle_hud_templates:
  - colosseum_stat_dps
  - colosseum_stat_heal
  - colosseum_stat_hp
# 限定搜索区域: 统计按钮位置固定, 只在这一块里找, 避免满屏乱匹配.
# 采集: 进一场战斗, python tools/cropper.py --live --roi-mode 框住那个统计按钮.
# 实测按钮真身在左上角 (命中位置 (64, 262) 且分数 1.000);
# 不限制时会在屏幕中央(战斗动作区)凑出 0.9 的假命中.
# ---- 战后收尾时序 ----
# 回到角斗场画面的判据: 这 3 个 tab 即使"被挑战弹窗"出现时也仍然可见
colosseum_tab_templates:
  - colosseum_ranking
  - colosseum_rewards
  - colosseum_battleRecord
# 关段位/结算层: 两次返回键的间隔 (黑屏 >2s, 0.5s 内补第二次来得及)
settle_back_gap: 0.5
# 关被挑战弹窗后, 关随即出现的小奖励弹窗的间隔 (必须快)
settle_blank_gap: 0.2

# ---- 刷新对手 ----
# 重复挑战第 3 个人, 挑战【失败】时该敌人不会自动刷新, 需手动点刷新按钮.
# 收尾完成后检查这个位置: 有刷新按钮就点, 没有就不管.
colosseum_refresh_roi: [1812, 712, 57, 58]   # 点击中心 (1840, 741)

# 实测: 结算画面与战斗画面的统计按钮【不在同一位置】,
# 所以限定这块区域后, "匹配到" 就等价于 "在战斗画面", 无需再校验颜色.
battle_hud_roi: [40, 240, 46, 48]   # 点击中心 (63, 264)
