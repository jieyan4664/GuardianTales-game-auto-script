# ---- 游玩页推断: 子页探针 ----
# 为什么需要这段:
#   游玩页没有固定不变的元素 —— 翻页箭头会左右飘, 靠它判定不稳.
#   但游玩页有 5 个选项: 推荐 / 裂痕 / PVP / 挑战 / 其他,
#   点这些选项【不会跳页】, 只是在页内切换一部分内容.
#   所以: 只要能确认处于其中任一子页, 就等价于处于游玩页.
#
# 为什么放在文件【末尾】:
#   Recognizer.detect 是"从上往下、命中即返回". 放在末尾后,
#   前面更具体的状态(PVP / RIFT_* 等)先命中就先返回;
#   全都没命中才轮到这里的探针, 于是"认出任意子页内容" → 推断为 PLAY_MENU.
#   (裂痕/PVP 各自已有专属规则会先命中, 这里不必重复登记.)
- state: PLAY_MENU
  template: thetis.png            # 推荐页: 忒提斯英雄传入口
  threshold: 0.85
  roi:
  - 855
  - 612
  - 54
  - 40
  _source: cropper
# TODO: 「挑战」「其他」两个子页暂无标识, 采到后按同样格式追加即可.
